[package]
name = "mycloud-crypto"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
crypto_secretbox = { version = "0.1", features = ["rand_core"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
blake2 = "0.10"
rand = "0.8"
thiserror = "1.0"
data-encoding = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hex = "0.4"
