<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AkSync</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0"/>
    <style>
        :root {
            --ui-scale: 1;
            /* System accent fallback or dynamic binding */
            --accent-color: #3584e4;
            --accent-fg: #ffffff;
            --font-family: system-ui, -apple-system, "Noto Sans", "Cantarell", "Ubuntu", "Segoe UI", Roboto, sans-serif;
            --radius-widget: 4px;
            --radius-box: 4px;
            
            /* Status colors (GNOME HIG / FreeDesktop standard) */
            --color-success: #2ec27e;
            --color-warning: #e5a50a;
            --color-error: #e01b24;
            --color-info: #3584e4;
        }

        html {
            font-size: calc(15px * var(--ui-scale, 1));
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Default to system preference (Dark) */
        :root, body.theme-dark, .theme-dark {
            --window-bg: #232629;
            --view-bg: #1b1e20;
            --card-bg: #31363b;
            --card-border: rgba(255, 255, 255, 0.10);
            --text-primary: #eff0f1;
            --text-secondary: #bdc3c7;
            --text-muted: #7f8c8d;
            --separator: rgba(255, 255, 255, 0.08);
            --row-hover: rgba(255, 255, 255, 0.04);
            color-scheme: dark;
        }

        /* Default to system preference (Light) when preferred */
        @media (prefers-color-scheme: light) {
            :root {
                --window-bg: #eff0f1;
                --view-bg: #fcfcfc;
                --card-bg: #ffffff;
                --card-border: rgba(0, 0, 0, 0.10);
                --text-primary: #232629;
                --text-secondary: #5e646a;
                --text-muted: #878c92;
                --separator: rgba(0, 0, 0, 0.08);
                --row-hover: rgba(0, 0, 0, 0.03);
                color-scheme: light;
            }
        }

        /* Explicit Light mode override */
        body.theme-light, .theme-light {
            --window-bg: #eff0f1;
            --view-bg: #fcfcfc;
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.10);
            --text-primary: #232629;
            --text-secondary: #5e646a;
            --text-muted: #878c92;
            --separator: rgba(0, 0, 0, 0.08);
            --row-hover: rgba(0, 0, 0, 0.03);
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, .app-root {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--window-bg);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1rem;
            -webkit-font-smoothing: antialiased;
        }

        /* -------------------------------------------------------------
           Masaüstü Ortamı Özelleştirmeleri (KDE Breeze vs GNOME Adwaita)
           ------------------------------------------------------------- */

        /* 1. KDE Breeze Stili (.de-kde) */
        .de-kde {
            --radius-widget: 4px;
            --radius-box: 4px;
        }

        .de-kde .btn {
            border-radius: 4px;
            padding: 0.45rem 0.9rem;
            font-size: 0.88rem;
            font-weight: 500;
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid color-mix(in srgb, var(--text-primary) 22%, transparent);
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
        }

        .de-kde .btn:hover {
            border-color: var(--accent-color);
            background: color-mix(in srgb, var(--accent-color) 14%, var(--card-bg));
        }

        .de-kde .btn-primary {
            border: 1px solid var(--accent-color);
            background: color-mix(in srgb, var(--accent-color) 22%, var(--card-bg));
            color: var(--text-primary);
        }

        .de-kde .btn-primary:hover {
            background: color-mix(in srgb, var(--accent-color) 32%, var(--card-bg));
            border-color: var(--accent-color);
        }

        .de-kde .nav-item {
            margin: 1px 0;
            padding: 0.65rem 1rem;
            border-left: 3px solid transparent;
            border-radius: 0;
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            background: transparent;
            border-top: none;
            border-right: none;
            border-bottom: none;
            width: 100%;
            text-align: left;
            transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
        }

        .de-kde .nav-item:hover {
            background: color-mix(in srgb, var(--text-primary) 6%, transparent);
            color: var(--text-primary);
        }

        .de-kde .nav-item.active {
            border-left-color: var(--accent-color);
            background: color-mix(in srgb, var(--accent-color) 20%, transparent);
            color: var(--text-primary);
            font-weight: 600;
        }

        /* 2. GNOME Libadwaita / GTK Stili (.de-gnome) */
        .de-gnome {
            --radius-widget: 6px;
            --radius-box: 8px;
        }

        .de-gnome .btn {
            border-radius: 6px;
            padding: 0.48rem 0.95rem;
            font-size: 0.88rem;
            font-weight: 600;
            background: color-mix(in srgb, var(--text-primary) 10%, var(--card-bg));
            color: var(--text-primary);
            border: 1px solid transparent;
            box-shadow: none;
        }

        .de-gnome .btn:hover {
            background: color-mix(in srgb, var(--text-primary) 15%, var(--card-bg));
        }

        .de-gnome .btn-primary {
            background: var(--accent-color);
            color: #ffffff;
            border: 1px solid transparent;
        }

        .de-gnome .btn-primary:hover {
            filter: brightness(1.08);
        }

        .de-gnome .nav-item {
            margin: 2px 0.5rem;
            padding: 0.6rem 0.85rem;
            border-radius: 6px;
            border-left: none;
            border: none;
            width: calc(100% - 1rem);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            background: transparent;
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: left;
            transition: background 0.12s ease, color 0.12s ease;
        }

        .de-gnome .nav-item:hover {
            background: color-mix(in srgb, var(--text-primary) 8%, transparent);
            color: var(--text-primary);
        }

        .de-gnome .nav-item.active {
            background: color-mix(in srgb, var(--accent-color) 22%, transparent);
            color: var(--text-primary);
            font-weight: 600;
        }

        /* -------------------------------------------------------------
           Ana Masaüstü İskeleti (Split-View Edge-to-Edge)
           ------------------------------------------------------------- */
        .desktop-split-layout {
            display: flex;
            flex: 1;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* Sol Kenar Çubuğu */
        .sidebar {
            width: 14.5rem;
            flex-shrink: 0;
            background: var(--view-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.75rem 0;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 2px;
        }

        .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Sol Alt Depolama ve Kilit Kutusu */
        .sidebar-footer {
            padding: 0.85rem 0.95rem 0.35rem;
            border-top: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .storage-status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .storage-pct-badge {
            color: var(--accent-color);
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 0.35rem;
            background: color-mix(in srgb, var(--text-primary) 12%, transparent);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            border-radius: 2px;
            transition: width 0.35s ease;
        }

        /* Sağ İçerik Bölmesi */
        .content-pane {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            background: var(--window-bg);
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* -------------------------------------------------------------
           Genel Buton & Form Elemanları
           ------------------------------------------------------------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            cursor: pointer;
            outline: none;
            text-decoration: none;
            line-height: 1.4;
            transition: background 0.12s ease, border-color 0.12s ease, filter 0.12s ease;
        }

        .btn:focus-visible {
            box-shadow: 0 0 0 2px var(--window-bg), 0 0 0 4px var(--accent-color);
        }

        .btn-full {
            width: 100%;
        }

        /* Native Checkbox */
        .native-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 1.2rem;
            height: 1.2rem;
            border-radius: var(--radius-widget, 4px);
            border: 1px solid color-mix(in srgb, var(--text-primary) 30%, transparent);
            background: var(--view-bg);
            cursor: pointer;
            display: inline-grid;
            place-content: center;
            flex-shrink: 0;
            transition: border-color 0.12s ease, background-color 0.12s ease;
            margin: 0;
            outline: none;
        }

        .native-checkbox:hover {
            border-color: var(--accent-color);
        }

        .native-checkbox:checked {
            background: color-mix(in srgb, var(--accent-color) 28%, var(--view-bg));
            border-color: var(--accent-color);
        }

        .native-checkbox:checked::after {
            content: "";
            width: 0.6rem;
            height: 0.34rem;
            border-left: 2px solid var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            transform: rotate(-45deg) translate(1px, -1px);
        }

        /* Checkbox Satırı */
        .checkbox-line {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.88rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.2rem 0.1rem;
            user-select: none;
        }

        .checkbox-line:hover {
            color: var(--text-primary);
        }

        /* Üst Durum ve Aksiyon Şeridi */
        .status-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-box, 4px);
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            min-width: 0;
            overflow: hidden;
        }

        .status-dot {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.55; }
        }

        .dot-idle { background: var(--color-success); }
        .dot-connecting {
            background: var(--accent-color);
            animation: pulse-dot 1.2s infinite ease-in-out;
            box-shadow: 0 0 6px var(--accent-color);
        }
        .dot-syncing {
            background: var(--accent-color);
            animation: pulse-dot 1.5s infinite ease-in-out;
        }
        .dot-paused { background: var(--color-warning); }
        .dot-offline { background: var(--text-muted); }
        .dot-error { background: var(--color-error); }

        .status-label {
            font-size: 0.94rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .speed-badge {
            font-size: 0.8rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 500;
            color: var(--accent-color);
            background: color-mix(in srgb, var(--accent-color) 12%, transparent);
            padding: 0.15rem 0.45rem;
            border-radius: var(--radius-widget, 4px);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .status-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        /* Gömülü Klasör Listesi Kutusu */
        .content-section {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .section-header-block {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .section-title {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .section-subtitle {
            font-size: 0.84rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .inset-list-box {
            background: var(--view-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-box, 4px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .folder-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.72rem 1rem;
            border-bottom: 1px solid var(--separator);
            cursor: pointer;
            transition: background 0.12s ease;
        }

        .folder-row:last-child {
            border-bottom: none;
        }

        .folder-row:nth-child(even) {
            background: color-mix(in srgb, var(--text-primary) 2%, transparent);
        }

        .folder-row:hover {
            background: color-mix(in srgb, var(--accent-color) 8%, transparent);
        }

        .folder-meta-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
            overflow: hidden;
        }

        .folder-icon-wrap {
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 1.5rem;
            height: 1.5rem;
        }

        .folder-name-col {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        .folder-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-path {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* -------------------------------------------------------------
           Ayarlar ve Kasa Güvenliği Kartları / Kutuları
           ------------------------------------------------------------- */
        .pref-box {
            background: var(--view-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-box, 4px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .pref-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.82rem 1rem;
            border-bottom: 1px solid var(--separator);
            gap: 0.75rem;
        }

        .pref-row:last-child {
            border-bottom: none;
        }

        .pref-row-meta {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .pref-row-label {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .pref-row-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .pref-form {
            padding: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            background: var(--view-bg);
        }

        .pref-input-row {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .pref-input-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .pref-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.52rem 0.8rem;
            border-radius: var(--radius-widget, 4px);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s ease;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .pref-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-color) 25%, transparent);
        }

        /* Segmented Button (Açık / Koyu / Sistem) */
        .segmented-control {
            display: inline-flex;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-widget, 4px);
            padding: 2px;
            gap: 2px;
            flex-shrink: 0;
        }

        .segmented-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.84rem;
            font-weight: 600;
            padding: 0.36rem 0.7rem;
            border-radius: calc(var(--radius-widget, 4px) - 1px);
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .segmented-btn:hover:not(.active) {
            background: color-mix(in srgb, var(--text-primary) 8%, transparent);
            color: var(--text-primary);
        }

        .segmented-btn.active {
            background: var(--accent-color);
            color: var(--accent-fg, #ffffff);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            font-weight: 600;
        }

        /* Renk Seçici */
        .color-picker-control {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        .color-swatch-input {
            -webkit-appearance: none;
            appearance: none;
            width: 1.9rem;
            height: 1.9rem;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-widget, 4px);
            cursor: pointer;
            padding: 0;
            background: transparent;
            outline: none;
        }

        .color-swatch-input::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-swatch-input::-webkit-color-swatch {
            border: none;
            border-radius: calc(var(--radius-widget, 4px) - 1px);
        }

        .color-hex-input {
            width: 5.5rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.84rem;
            padding: 0.32rem 0.45rem;
            border-radius: var(--radius-widget, 4px);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            text-align: center;
            outline: none;
        }

        .color-hex-input:focus {
            border-color: var(--accent-color);
        }

        /* -------------------------------------------------------------
           Ortalanmış Tam Pencere Görünümleri (Setup / Unlock)
           ------------------------------------------------------------- */
        .centered-view-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            padding: 1.5rem;
            background: var(--window-bg);
        }

        .unlock-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-box, 4px);
            max-width: 28rem;
            width: 100%;
            text-align: center;
            padding: 2rem 1.75rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .unlock-icon {
            width: 3rem;
            height: 3rem;
            margin: 0 auto 1rem;
            background: color-mix(in srgb, var(--accent-color) 16%, transparent);
            border-radius: var(--radius-box, 4px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
        }

        .wizard-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 32rem;
            width: 100%;
            margin: 0 auto;
        }

        .wizard-header {
            text-align: center;
            margin-bottom: 0.35rem;
        }

        .wizard-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .wizard-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .wizard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-box, 4px);
            padding: 1.25rem;
        }

        .wizard-step-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }

        .system-badge {
            font-size: 0.72rem;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-widget, 4px);
            background: var(--view-bg);
            border: 1px solid var(--card-border);
            font-weight: 600;
        }

        .wizard-step-title {
            font-size: 1rem;
            font-weight: 650;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .wizard-step-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.45;
        }

        .wizard-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .wizard-input {
            width: 100%;
            background: var(--view-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-widget, 4px);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .wizard-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-color) 25%, transparent);
        }

        .wizard-status-msg {
            font-size: 0.8rem;
            margin-top: 0.6rem;
            padding: 0.55rem 0.85rem;
            border-radius: var(--radius-widget, 4px);
        }

        .wizard-msg-success {
            background: rgba(46, 194, 126, 0.15);
            color: var(--color-success);
            border: 1px solid rgba(46, 194, 126, 0.3);
        }

        .wizard-msg-error {
            background: rgba(224, 27, 36, 0.15);
            color: var(--color-error);
            border: 1px solid rgba(224, 27, 36, 0.3);
        }

        /* -------------------------------------------------------------
           Animasyonlar & Yardımcılar
           ------------------------------------------------------------- */
        .spinner {
            display: inline-block;
            width: 0.85rem;
            height: 0.85rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spin-anim {
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.05) 25%,
                rgba(255, 255, 255, 0.13) 50%,
                rgba(255, 255, 255, 0.05) 75%
            );
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite ease-in-out;
            border-radius: 3px;
            display: inline-block;
        }

        .theme-light .skeleton {
            background: linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.04) 25%,
                rgba(0, 0, 0, 0.10) 50%,
                rgba(0, 0, 0, 0.04) 75%
            );
            background-size: 200% 100%;
        }

        .skeleton-text {
            height: 0.85rem;
            width: 80px;
            vertical-align: middle;
        }
    </style>
